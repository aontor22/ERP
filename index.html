<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexERP Enterprise Platform</title>
    <meta name="description" content="Comprehensive enterprise-grade modular ERP platform featuring multi-company organizational hierarchies, double-entry general ledger, inventory engine, sales, procurement, manufacturing MRP, HR/payroll, approval workflows, and immutable audit logs." />
    <meta property="og:title" content="ApexERP Enterprise Platform" />
    <meta property="og:description" content="Comprehensive enterprise-grade modular ERP platform featuring multi-company organizational hierarchies, double-entry general ledger, inventory engine, sales, procurement, manufacturing MRP, HR/payroll, approval workflows, and immutable audit logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('apex_theme');
          if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
